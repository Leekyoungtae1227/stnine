<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>상품 리스트</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <style>
      div {
        min-height: 100px;
        border: 1px solid #333;
      }
      .row {
        border: 1px solid yellowgreen;
      }
    </style>
  </head>
  <body>
    <div class="slide-wrapper-in"></div>

    <script>
      fetch("js/best.json")
        .then((res) => res.json())
        .then((data) => {
          let slidePage = "";
          const itemsPerPage = 8;
          const totalPage = Math.ceil(data.length / itemsPerPage);

          for (let i = 0; i < totalPage; i++) {
            let colPage = "";
            const pageItems = data.slice(
              i * itemsPerPage,
              (i + 1) * itemsPerPage
            );

            pageItems.forEach((item) => {
              let colorHtml = item.color
                .map((c) => `<span class="${c}"></span>`)
                .join("");

              colPage += `
                <div class="col-md-3 my-3">
                  <a href="#" class="img-best-box">
                    <img src="${item.img}" alt="${item.alt}">
                    <div class="pd-best-box text-center">
                      <div class="pd-color">${colorHtml}</div>
                      <div class="best-title">${item.title}</div>
                      <div class="pd-best-pay">
                        <del>${item.cost}원</del>
                        <span class="sail">${item.sale}</span>
                        <span class="money">${item.price}원</span>
                      </div>
                    </div>
                    <div class="btn-box">
                      <button type="button" class="best-cart">
                        <i class="ri-shopping-bag-4-line"></i>
                      </button>
                      <button type="button" class="best-heart">
                        <i class="ri-heart-line"></i>
                      </button>
                    </div>
                  </a>
                </div>`;
            });

            slidePage += `<div class="row slide-page">${colPage}</div>`;
          }

          document.querySelector(".slide-wrapper-in").innerHTML = slidePage;
        })
        .catch((err) => {
          console.error("JSON 로딩 에러: ", err);
        });
    </script>
  </body>
</html>
